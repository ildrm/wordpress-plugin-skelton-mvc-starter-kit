name: Quality

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: find app bootstrap config routes resources/views tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -l plugin-name.php && php -l uninstall.php
      - run: composer quality

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: wordpress-mvc-assets
          path: public/build

  wordpress-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.5', 'latest']
    services:
      database:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: temporary-test-only
          MARIADB_DATABASE: starterkit_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: curl -fsSLo /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
      - run: |
          if [[ '${{ matrix.wordpress }}' == latest ]]; then
            php /tmp/wp core download --path=/tmp/starterkit-wp --skip-content
          else
            php /tmp/wp core download --version=${{ matrix.wordpress }} --path=/tmp/starterkit-wp --skip-content
          fi
      - run: php /tmp/wp config create --dbname=starterkit_test --dbuser=root --dbpass=temporary-test-only --dbhost=127.0.0.1:3306 --path=/tmp/starterkit-wp --skip-check
      - run: mkdir -p /tmp/starterkit-wp/wp-content/plugins && ln -s "$GITHUB_WORKSPACE" /tmp/starterkit-wp/wp-content/plugins/wordpress-mvc-starter
      - run: php /tmp/wp core install --url=http://localhost:8999 --title=StarterKitTest --admin_user=starterkit --admin_password=temporary-test-only --admin_email=test@example.com --path=/tmp/starterkit-wp --skip-email
      - run: php /tmp/wp plugin activate wordpress-mvc-starter --path=/tmp/starterkit-wp
      # WP-CLI evaluates these files; strict_types declarations cause a fatal error on PHP 8.3.
      - run: php /tmp/wp eval-file tests/Integration/smoke.php --path=/tmp/starterkit-wp
      - run: php /tmp/wp eval-file tests/Integration/lifecycle-smoke.php --path=/tmp/starterkit-wp
      - run: php /tmp/wp eval-file tests/Integration/admin-smoke.php --path=/tmp/starterkit-wp --context=admin
      - run: php /tmp/wp eval-file tests/Integration/ajax-smoke.php --path=/tmp/starterkit-wp --context=admin | grep -q '"greeting":"AJAX works"'
      - run: php /tmp/wp eval-file tests/Integration/ajax-invalid-nonce-smoke.php --path=/tmp/starterkit-wp --context=admin | grep -q 'Invalid security token.'
      - run: php /tmp/wp eval-file tests/Integration/ajax-forbidden-smoke.php --path=/tmp/starterkit-wp --context=admin | grep -q 'Permission denied.'

  release-check:
    runs-on: ubuntu-latest
    needs: [php, assets, wordpress-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: actions/download-artifact@v4
        with:
          name: wordpress-mvc-assets
          path: public/build
      - run: bash scripts/package.sh
      - run: unzip -t dist/wordpress-mvc-starter.zip
